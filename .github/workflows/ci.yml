# this_file: .github/workflows/ci.yml
name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  quality:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Ruff lint
        uses: astral-sh/ruff-action@v3
        with:
          version: "latest"
          args: "check --output-format=github"

      - name: Run Ruff Format
        uses: astral-sh/ruff-action@v3
        with:
          version: "latest"
          args: "format --check --respect-gitignore"

  test:
    name: Run Tests
    needs: quality
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.10', '3.11', '3.12']
      fail-fast: false
        
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Needed for version detection
        
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        
    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        version: "latest"
        python-version: ${{ matrix.python-version }}
        enable-cache: true
        cache-suffix: ${{ matrix.os }}-${{ matrix.python-version }}
      
    - name: Install dependencies (Unix)
      if: runner.os != 'Windows'
      run: |
        uv pip install --system pytest pytest-cov pytest-xdist pytest-asyncio mypy ruff fire playwright requests platformdirs loguru rich aiohttp
        
    - name: Install dependencies (Windows)
      if: runner.os == 'Windows'
      run: |
        uv pip install --system pytest pytest-cov pytest-xdist pytest-asyncio mypy ruff fire playwright requests platformdirs loguru rich aiohttp
        
    - name: Install macOS-specific dependencies
      if: runner.os == 'macOS'
      run: |
        uv pip install --system macdefaultbrowsy
        
    - name: Run type checking
      run: |
        uv run mypy src/geminpy tests/
      
    - name: Run tests
      run: |
        uv run pytest --cov=src/geminpy --cov-report=xml --cov-report=term-missing -v tests/
      env:
        PYTHONPATH: src
      
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        token: ${{ secrets.CODECOV_TOKEN }}
        fail_ci_if_error: false